name: Uptime Monitoring Engine

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: uptime-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    name: Check Website Availability
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Monitoring Cycle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/check.py

      - name: Validate Output JSON Data
        run: |
          python scripts/validate.py --check-data

      - name: Commit and Push Monitoring Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f public/data/
          if git diff --staged --quiet; then
            echo "No monitoring data changes detected."
          else
            git commit -m "chore(data): record uptime check results [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
